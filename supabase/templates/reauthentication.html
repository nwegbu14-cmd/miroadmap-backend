<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Verify a sensitive MiRoadmap action</title>
</head>

<body
    style="margin:0;padding:0;background:#4f6bff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#18181b">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#4f6bff"
        style="background-color:#4f6bff;background-image:linear-gradient(rgba(255,255,255,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.10) 1px,transparent 1px);background-size:48px 48px">
        <tr>
            <td align="center" style="padding:40px 16px">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                    style="max-width:560px">
                    <tr>
                        <td align="center" style="padding:0 0 20px">
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                                <tr>
                                    <td valign="middle" style="padding-right:10px"><img
                                            src="https://www.miroadmap.co/logo.png" width="48" height="48"
                                            alt="MiRoadmap"
                                            style="display:block;width:48px;height:48px;border:0;border-radius:24px;background:#fff">
                                    </td>
                                    <td valign="middle"
                                        style="color:#fff;font-size:22px;font-weight:700;letter-spacing:-.3px">
                                        MiRoadmap</td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td bgcolor="#fff" style="border-radius:28px;padding:48px 32px;text-align:center">
                            <div
                                style="display:inline-block;border-radius:999px;background:#fff7e8;padding:8px 14px;color:#a15c00;font-size:12px;font-weight:700;text-transform:uppercase">
                                Identity check</div>
                            <h1 style="margin:22px 0 12px;font-size:30px">Verify it&rsquo;s you</h1>
                            <p style="margin:0;color:#71717a;font-size:15px;line-height:1.7">Use this code to approve
                                the sensitive action you started in MiRoadmap.</p>
                            <div
                                style="margin:28px auto 16px;border:1px solid #ffe0ad;border-radius:18px;background:#fffbf3;padding:20px 12px;color:#a15c00;font-family:Consolas,monospace;font-size:34px;font-weight:700;letter-spacing:8px">
                                {{ .Token }}</div>
                            <div
                                style="margin-top:24px;border-top:1px solid #ececf0;padding-top:22px;color:#a1a1aa;font-size:12px">
                                If you did not start this action, do not share the code. Secure your account and contact
                                support.</div>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding:22px 12px 0;color:#dfe4ff;font-size:11px">&copy; MiRoadmap
                            &middot; <a href="mailto:support@miroadmap.co" style="color:#dfe4ff">Support</a></td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
